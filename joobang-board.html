<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>장날동천 주방 대시보드</title>
    <link rel="icon" href="data:,">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');

        :root {
            --bg-color: #121212;
            --surface-color: #1a1a1a;
            --surface-sub: #242424;
            --border-color: #333333;
            --text-main: #F8F7F4;
            --text-sub: #9E9A90;
            --accent-gold: #C5A059;
            --accent-gold-bg: rgba(197, 160, 89, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard Variable', Pretendard, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 6px;
            font-size: 14.5px;
            overflow-x: hidden;
        }

        #blurOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(18, 18, 18, 0.72);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            cursor: pointer;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .blur-popup-card {
            background: var(--surface-color);
            border: 1px solid rgba(197, 160, 89, 0.4);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            cursor: pointer;
            animation: popupBounce 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popupBounce {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .popup-badge {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent-gold);
            background: var(--accent-gold-bg);
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
            display: inline-block;
            border: 1px solid rgba(197, 160, 89, 0.2);
        }

        .popup-title {
            font-size: 21px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        .popup-desc {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.6;
            word-break: keep-all;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-color);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid var(--border-color);
            gap: 6px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 0.92rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .key-btn {
            background: var(--surface-sub);
            border: 1px solid var(--border-color);
            padding: 3px 7px;
            border-radius: 5px;
            font-size: 0.68rem;
            color: var(--accent-gold);
            font-weight: 700;
            cursor: pointer;
        }

        .key-btn:hover {
            background: #2c2c2c;
        }

        .status-badge {
            background: var(--surface-sub);
            border: 1px solid var(--border-color);
            padding: 3px 7px;
            border-radius: 5px;
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        .online-status-container {
            position: relative;
            display: inline-block;
            z-index: 100;
        }

        .online-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: var(--surface-sub);
            border: 1px solid var(--border-color);
            padding: 4px 9px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .online-badge:hover {
            background-color: #2a2a2a;
            border-color: #444;
        }

        .pulse-dot {
            width: 6.5px;
            height: 6.5px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
            70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .badge-text {
            font-size: 0.72rem;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .arrow-icon {
            font-size: 0.58rem;
            color: var(--text-sub);
            transition: transform 0.2s;
        }

        .online-badge.active .arrow-icon {
            transform: rotate(180deg);
        }

        .online-dropdown-panel {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            width: 200px;
            background: var(--surface-color);
            border-radius: 10px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: none;
            z-index: 1000;
        }

        .dropdown-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background-color: var(--surface-sub);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .online-user-list {
            list-style: none;
            margin: 0;
            padding: 5px;
            max-height: 160px;
            overflow-y: auto;
        }

        .online-user-list li {
            padding: 6px 8px;
            font-size: 0.76rem;
            color: var(--text-main);
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .online-user-list li:hover {
            background-color: var(--surface-sub);
        }

        .online-user-list li::before {
            content: "•";
            color: var(--accent-gold);
            font-weight: bold;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .order-item {
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            background: var(--surface-color);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            border-left-width: 4.5px;
        }

        .order-item.unconfirmed {
            border-left-color: #ef4444;
            background: #1c1515;
        }

        .order-item.confirmed {
            border-left-color: #22c55e;
            background: #141c14;
        }

        .order-info {
            flex: 1;
            padding: 7px 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .time-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .time-tag {
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--accent-gold);
            letter-spacing: -0.5px;
        }

        .winner-badge {
            background: rgba(236, 72, 153, 0.15);
            color: #f472b6;
            border: 1px solid rgba(236, 72, 153, 0.3);
            font-size: 0.6rem;
            padding: 1px 5px;
            border-radius: 4px;
            font-weight: 700;
            white-space: nowrap;
        }

        .coupon-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, rgba(197, 160, 89, 0.22) 0%, rgba(197, 160, 89, 0.08) 100%);
            color: #f3d79b;
            border: 1px solid rgba(197, 160, 89, 0.48);
            box-shadow: inset 0 1px 0 rgba(255, 245, 220, 0.12);
            font-size: 0.66rem;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .cooking-badge {
            display: inline-block;
            background: var(--surface-sub);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .cooking-badge.special {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .menu-text {
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.35;
            word-break: keep-all;
        }

        .bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 2px;
            gap: 6px;
        }

        .sub-info-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .sauce-text {
            font-size: 0.72rem;
            color: #fb923c;
            font-weight: 700;
        }

        .nickname-text {
            font-size: 0.72rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .price-group {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .price-tag {
            font-size: 0.85rem;
            font-weight: 800;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.12);
            border: 1px solid rgba(74, 222, 128, 0.25);
            padding: 2px 7px;
            border-radius: 5px;
            white-space: nowrap;
            letter-spacing: -0.02em;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .price-tag.discounted {
            color: #f6dfa4;
            background: linear-gradient(135deg, rgba(197, 160, 89, 0.22) 0%, rgba(74, 222, 128, 0.14) 100%);
            border: 1px solid rgba(197, 160, 89, 0.55);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .price-discount-sub {
            font-size: 0.64rem;
            font-weight: 700;
            color: #4ade80;
            letter-spacing: -0.02em;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3px;
            padding: 4px;
            background: rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
            border-left: 1px solid var(--border-color);
        }

        .btn-status {
            width: 55px;
            height: 29px;
            font-size: 0.65rem;
            font-weight: 700;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: filter 0.2s;
        }

        .btn-status:hover {
            filter: brightness(1.1);
        }

        .btn-status.unconfirmed {
            background: #dc2626;
        }

        .btn-status.confirmed {
            background: #16a34a;
        }

        .btn-done {
            width: 55px;
            height: 29px;
            font-size: 0.65rem;
            font-weight: 700;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: filter 0.2s;
        }

        .btn-done:hover {
            filter: brightness(1.1);
        }

        .btn-done:active {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div id="blurOverlay" onclick="startDashboard()">
        <div class="blur-popup-card">
            <div class="popup-badge">장날동천 시스템</div>
            <div style="font-size: 2.5rem; margin-bottom: 12px;">🍳</div>
            <h2 class="popup-title">주방 뷰를 시작합니다</h2>
            <p class="popup-desc">
                실시간 주문 접수 시스템이 준비되었습니다.<br>화면을 터치하여 관리자 인증 후 대시보드를 활성화하세요.
            </p>
        </div>
    </div>

    <header>
        <h1>🍳 장날동천 주방 뷰</h1>

        <div class="header-right">
            <button type="button" class="key-btn" onclick="handleManualKeyChange()">🔑 키 재입력</button>

            <div class="online-status-container">
                <button id="onlineBadgeBtn" class="online-badge" onclick="toggleOnlineDropdown()">
                    <span class="pulse-dot"></span>
                    <span id="activeVisitorsBadge" class="badge-text">접속 중: 0명</span>
                    <span class="arrow-icon">▼</span>
                </button>

                <div id="onlineDropdownPanel" class="online-dropdown-panel">
                    <div class="dropdown-header">
                        <span>실시간 접속 목록</span>
                        <span id="dropdownSubCount">총 0명</span>
                    </div>
                    <ul id="onlineUserList" class="online-user-list">
                        <li style="color: #888; justify-content: center;">목록 로딩중...</li>
                    </ul>
                </div>
            </div>

            <div class="status-badge">대기: <span id="unconfirmedCount" style="color:#ef4444; font-weight:bold;">0</span> / 총
                <span id="totalCount">0</span></div>
        </div>
    </header>

    <div id="custom-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); z-index: 9999; justify-content: center; align-items: center;">
        <div
            style="background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 14px; padding: 26px; width: 330px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; color: #fff;">
            <h3 id="modal-title" style="margin: 0 0 10px 0; font-size: 17px; font-weight: 800; color: var(--accent-gold);">수령 완료 처리</h3>
            <p id="modal-desc" style="margin: 0 0 22px 0; font-size: 14px; color: var(--text-sub); line-height: 1.5;">고객에게 돈가스를 전달하고<br>수령 완료 처리하시겠습니까?</p>
            <div style="display: flex; gap: 8px;">
                <button id="modal-cancel-btn"
                    style="flex: 1; padding: 11px; background: var(--surface-sub); color: var(--text-sub); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; font-weight: 700;">취소</button>
                <button id="modal-confirm-btn"
                    style="flex: 1; padding: 11px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 700;">확인</button>
            </div>
        </div>
    </div>

    <div id="orderContainer" class="order-list">
        <div style="text-align:center; padding: 25px; color:var(--text-sub);">관리자 인증 후 주문 목록을 불러옵니다...</div>
    </div>

    <script>
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyKvuhElltd2F0V2SdH615cQr5Ax5qA0Dt5ShOpcjNstoCzfQydnUGrqZ9gX1DmlPRoNw/exec";
        const KAKAO_JS_KEY = "db06049bca3d739bbf1d8d9d0cad1b5b";
        let previousTotalCount = 0;
        let isInitialLoad = true;
        let lastOrderSignature = "";
        let lastActiveUsersSignature = "";
        let isFetchingOrders = false;
        let isFetchingActiveUsers = false;
        let isAdminAuthenticated = false;

        function escapeHtml(str) {
            return String(str === null || str === undefined ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeJsSingleQuote(str) {
            return String(str === null || str === undefined ? '' : str)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'");
        }

        function normalizeKakaoId(raw) {
            if (raw === null || raw === undefined) return "";
            let s = String(raw).trim();
            if (!s) return "";
            if (s.toLowerCase().startsWith("kakao_")) s = s.slice(6).trim();
            if (/^\d+\.0$/.test(s)) s = s.replace(/\.0$/, "");
            return s;
        }

        function formatKakaoId(raw) {
            const norm = normalizeKakaoId(raw);
            if (!norm) return "";
            return /^\d+$/.test(norm) ? ("kakao_" + norm) : norm;
        }

        function getKakaoId() {
            const params = new URLSearchParams(window.location.search);
            const fromUrl = (params.get("kakaoId") || params.get("kakao_id") || params.get("clientId") || "").trim();
            if (fromUrl) {
                const normUrl = normalizeKakaoId(fromUrl);
                if (normUrl) {
                    try {
                        localStorage.setItem("jnal_kakao_id", normUrl);
                        sessionStorage.setItem("jnal_kakao_id", normUrl);
                        localStorage.setItem("donkatsu_kakao_id", normUrl);
                    } catch (e) {}
                    return normUrl;
                }
            }
            try {
                const rawStored = (
                    sessionStorage.getItem("jnal_kakao_id") ||
                    localStorage.getItem("jnal_kakao_id") ||
                    localStorage.getItem("donkatsu_kakao_id") ||
                    localStorage.getItem("donkatsu_client_id") ||
                    localStorage.getItem("kakaoId") ||
                    ""
                ).trim();
                return normalizeKakaoId(rawStored);
            } catch (e) {
                return "";
            }
        }

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function hideBlurOverlay() {
            const overlay = document.getElementById('blurOverlay');
            if (overlay) {
                overlay.style.opacity = '0';
                overlay.style.visibility = 'hidden';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 400);
            }
        }

        function startDashboard() {
            getAudioContext();
            ensureAdminAuth(function () {
                hideBlurOverlay();
                lastOrderSignature = "";
                lastActiveUsersSignature = "";
                fetchOrders();
                fetchActiveUsers();
            });
        }

        // ===== [보안 패치] 주방 대시보드 관리자 인증 (ADMIN_API_KEY) =====
        const ADMIN_KEY_STORAGE_NAME = 'jnal_admin_key';

        function getStoredAdminKey() {
            try { return (localStorage.getItem(ADMIN_KEY_STORAGE_NAME) || '').trim(); } catch (e) { return ''; }
        }

        function setStoredAdminKey(val) {
            try {
                if (val) localStorage.setItem(ADMIN_KEY_STORAGE_NAME, String(val).trim());
                else localStorage.removeItem(ADMIN_KEY_STORAGE_NAME);
            } catch (e) { }
        }

        function verifyKeyWithServer(candidateKey, done) {
            const clean = String(candidateKey || '').trim();
            if (!clean) {
                if (done) done(false);
                return;
            }
            callGasAPI('verifyAdminCode', { code: clean, adminKey: clean }, function (res) {
                const ok = Boolean(res && res.result === 'ok' && res.valid === true);
                if (done) done(ok);
            }, true);
        }

        function ensureAdminAuth(onSuccess) {
            const stored = getStoredAdminKey();
            if (stored) {
                verifyKeyWithServer(stored, function (isValid) {
                    if (isValid) {
                        isAdminAuthenticated = true;
                        onSuccess();
                    } else {
                        setStoredAdminKey('');
                        isAdminAuthenticated = false;
                        promptAdminKey(onSuccess);
                    }
                });
                return;
            }
            promptAdminKey(onSuccess);
        }

        function promptAdminKey(onSuccess) {
            const entered = prompt("주방 대시보드 관리자 키(ADMIN_API_KEY)를 입력하세요:");
            if (entered === null) {
                alert("관리자 키를 입력해야 주방 뷰를 사용할 수 있습니다.");
                return;
            }
            const trimmed = String(entered).trim();
            if (!trimmed) {
                promptAdminKey(onSuccess);
                return;
            }
            verifyKeyWithServer(trimmed, function (isValid) {
                if (isValid) {
                    setStoredAdminKey(trimmed);
                    isAdminAuthenticated = true;
                    onSuccess();
                } else {
                    alert("관리자 키가 올바르지 않습니다. 다시 입력해 주세요.");
                    promptAdminKey(onSuccess);
                }
            });
        }

        function handleManualKeyChange() {
            setStoredAdminKey('');
            isAdminAuthenticated = false;
            promptAdminKey(function () {
                hideBlurOverlay();
                lastOrderSignature = "";
                lastActiveUsersSignature = "";
                fetchOrders();
                fetchActiveUsers();
            });
        }

        let __adminReauthInProgress = false;
        function handleAdminAuthFailure() {
            isAdminAuthenticated = false;
            if (__adminReauthInProgress) return;
            __adminReauthInProgress = true;
            setStoredAdminKey('');
            promptAdminKey(function () {
                __adminReauthInProgress = false;
                hideBlurOverlay();
                lastOrderSignature = "";
                lastActiveUsersSignature = "";
                fetchOrders();
                fetchActiveUsers();
            });
        }

        function playNewOrderSound() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;

                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.frequency.setValueAtTime(523.25, now);
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc1.connect(gain1); gain1.connect(ctx.destination);
                osc1.start(now); osc1.stop(now + 0.3);

                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.frequency.setValueAtTime(659.25, now + 0.15);
                gain2.gain.setValueAtTime(0.3, now + 0.15);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc2.connect(gain2); gain2.connect(ctx.destination);
                osc2.start(now + 0.15); osc2.stop(now + 0.45);
            } catch (e) { }
        }

        function callGasAPI(action, params = {}, callback, skipAuthCheck = false) {
            const callbackName = 'jsonp_cb_' + Math.random().toString(36).substring(2, 9);
            let settled = false;
            const script = document.createElement('script');

            const cleanup = () => {
                // 늦게 도착한 응답이 호출되어도 ReferenceError가 나지 않도록 빈 함수로 유지
                window[callbackName] = function () {};
                if (script.parentNode) {
                    try { script.parentNode.removeChild(script); } catch (e) {}
                }
                setTimeout(() => {
                    try { delete window[callbackName]; } catch (e) {}
                }, 60000);
            };

            const timer = setTimeout(() => {
                if (settled) return;
                settled = true;
                cleanup();
                if (callback) callback(null);
            }, 10000);

            window[callbackName] = function (data) {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                cleanup();
                if (callback) callback(data);
            };

            const kakaoId = getKakaoId();
            const mergedParams = Object.assign({}, params);
            if (kakaoId && !mergedParams.kakaoId) {
                mergedParams.kakaoId = kakaoId;
            }
            if (kakaoId && !mergedParams.clientId) {
                mergedParams.clientId = formatKakaoId(kakaoId);
            }
            const storedAdminKeyForCall = getStoredAdminKey();
            if (!skipAuthCheck && storedAdminKeyForCall && !mergedParams.adminKey) {
                mergedParams.adminKey = storedAdminKeyForCall;
            }
            mergedParams._ts = Date.now();

            let url = GAS_WEBAPP_URL + '?action=' + encodeURIComponent(action) + '&callback=' + encodeURIComponent(callbackName);
            for (let key in mergedParams) {
                if (mergedParams[key] !== undefined && mergedParams[key] !== null) {
                    url += '&' + key + '=' + encodeURIComponent(mergedParams[key]);
                }
            }

            script.src = url;
            script.onerror = function () {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                cleanup();
                if (callback) callback(null);
            };
            document.body.appendChild(script);
        }

        function fetchOrders() {
            if (!isAdminAuthenticated || isFetchingOrders) return;
            isFetchingOrders = true;
            callGasAPI('getAdminOrderList', {}, function (data) {
                isFetchingOrders = false;
                if (data === null || data === undefined) return;
                if (data && data.result === 'error') {
                    handleAdminAuthFailure();
                    return;
                }
                const ordersList = Array.isArray(data)
                    ? data
                    : (data && Array.isArray(data.orders) ? data.orders : null);
                if (!ordersList) return;
                renderOrders(ordersList);
            });
        }

        function renderOrders(orders) {
            const container = document.getElementById('orderContainer');

            if (!Array.isArray(orders)) {
                orders = [];
            }

            const sig = JSON.stringify(orders.map(o => ({
                r: o.rowIndex,
                s: o.status,
                t: o.pickupTime,
                c: o.cooking,
                m: o.menu,
                es: o.extraSauce,
                n: o.nickname,
                p: o.totalPrice,
                ep: o.eventPrize || o.eventWinner || '',
                uc: o.usedCoupon || '',
                cd: Number(o.couponDiscount) || 0,
                k: normalizeKakaoId(o.kakaoId)
            })));

            if (!isInitialLoad && sig === lastOrderSignature) {
                return;
            }
            lastOrderSignature = sig;

            if (!orders || orders.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 25px; color:var(--text-sub);">접수된 대기 예약이 없습니다.</div>';
                document.getElementById('unconfirmedCount').innerText = 0;
                document.getElementById('totalCount').innerText = 0;
                previousTotalCount = 0;
                isInitialLoad = false;
                return;
            }

            if (!isInitialLoad && orders.length > previousTotalCount) {
                playNewOrderSound();
            }

            previousTotalCount = orders.length;
            isInitialLoad = false;

            let unconfirmedCnt = 0;
            let html = '';

            orders.forEach(item => {
                const statusVal = String(item.status || '미확인').trim();
                const isUnconfirmed = (statusVal === '미확인');
                if (isUnconfirmed) unconfirmedCnt++;

                const cookingVal = String(item.cooking || '').trim();
                const isSpecialCooking = cookingVal.includes('비튀김') || cookingVal.includes('생고기') || cookingVal.includes('안튀김');

                const usedCouponText = String(item.usedCoupon || '').trim();
                const couponDiscountNum = Math.max(0, Number(String(item.couponDiscount || 0).replace(/[^0-9]/g, '')) || 0);
                const hasCoupon = Boolean(usedCouponText || couponDiscountNum > 0);

                let priceDisplay = '';
                let hasNumericPrice = false;
                if (item.totalPrice !== undefined && item.totalPrice !== '') {
                    let num = Number(String(item.totalPrice).replace(/[^0-9]/g, ''));
                    if (!isNaN(num) && (num > 0 || hasCoupon)) {
                        priceDisplay = num.toLocaleString() + '원';
                        hasNumericPrice = true;
                    } else {
                        priceDisplay = String(item.totalPrice);
                    }
                } else if (hasCoupon) {
                    priceDisplay = '0원';
                    hasNumericPrice = true;
                }

                let eventText = item.eventWinner || item.eventPrize || item.event || '';
                if (!eventText) {
                    for (let key in item) {
                        if (key === 'kakaoId' || key === 'rowIndex' || key === 'totalPrice' || key === 'usedCoupon' || key === 'couponDiscount') continue;
                        let val = String(item[key] || '');
                        if (val.includes('당첨') || val.includes('서비스')) {
                            eventText = val;
                            break;
                        }
                    }
                }

                let eventDetailHtml = '';
                if (eventText) {
                    eventDetailHtml = `<span class="winner-badge">🎁 ${escapeHtml(eventText)}</span>`;
                }

                let couponBadgeHtml = '';
                if (hasCoupon) {
                    const couponLabel = usedCouponText
                        ? usedCouponText
                        : `쿠폰 할인 (-${couponDiscountNum.toLocaleString()}원)`;
                    couponBadgeHtml = `<span class="coupon-badge">🎫 ${escapeHtml(couponLabel)}</span>`;
                }

                let priceHtml = '';
                if (priceDisplay) {
                    if (hasCoupon) {
                        const subText = (couponDiscountNum > 0 && usedCouponText && !usedCouponText.includes('원'))
                            ? `<span class="price-discount-sub">(-${couponDiscountNum.toLocaleString()}원)</span>`
                            : `<span class="price-discount-sub">할인적용</span>`;
                        priceHtml = `<div class="price-tag discounted">💰 ${escapeHtml(priceDisplay)} ${subText}</div>`;
                    } else {
                        priceHtml = `<div class="price-tag">💰 ${escapeHtml(priceDisplay)}</div>`;
                    }
                }

                const safeRowIndex = Number(item.rowIndex) || 0;
                const safeStatusJs = escapeJsSingleQuote(statusVal);

                html += `
                    <div class="order-item ${isUnconfirmed ? 'unconfirmed' : 'confirmed'}">
                        <div class="order-info">
                            <div class="top-row">
                                <div class="time-group">
                                    <span class="time-tag">⏰ ${escapeHtml(item.pickupTime || '')}</span>
                                    ${eventDetailHtml}
                                    ${couponBadgeHtml}
                                </div>
                                <span class="cooking-badge ${isSpecialCooking ? 'special' : ''}">조리: ${escapeHtml(cookingVal || '튀김')}</span>
                            </div>
                            <div class="menu-text">${escapeHtml(item.menu || '')}</div>
                            <div class="bottom-row">
                                <div class="sub-info-group">
                                    ${item.extraSauce && item.extraSauce !== '없음' ? '<span class="sauce-text">소스: ' + escapeHtml(item.extraSauce) + '</span>' : ''}
                                    <span class="nickname-text">👤 ${escapeHtml(item.nickname || '')}</span>
                                </div>
                                <div class="price-group">
                                    ${priceHtml}
                                </div>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="btn-status ${isUnconfirmed ? 'unconfirmed' : 'confirmed'}" 
                                    onclick="toggleStatus(${safeRowIndex}, '${safeStatusJs}')">
                                ${isUnconfirmed ? '미확인🔴' : '확인완료🟢'}
                            </button>
                            <button class="btn-done" onclick="completeOrder(${safeRowIndex})">
                                수령완료🏁
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('unconfirmedCount').innerText = unconfirmedCnt;
            document.getElementById('totalCount').innerText = orders.length;
        }

        function toggleStatus(rowIndex, currentStatus) {
            if (!isAdminAuthenticated) return;
            getAudioContext();
            const nextStatus = (currentStatus === '미확인') ? '확인' : '미확인';
            callGasAPI('updateOrderStatus', { rowIndex: String(rowIndex), status: nextStatus }, function (res) {
                if (res && res.result === 'error') {
                    handleAdminAuthFailure();
                    return;
                }
                lastOrderSignature = "";
                fetchOrders();
            });
        }

        function completeOrder(rowIndex) {
            if (!isAdminAuthenticated) return;
            getAudioContext();
            const modal = document.getElementById('custom-modal');
            const confirmBtn = document.getElementById('modal-confirm-btn');
            const cancelBtn = document.getElementById('modal-cancel-btn');

            modal.style.display = 'flex';

            const newConfirmBtn = confirmBtn.cloneNode(true);
            const newCancelBtn = cancelBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            newConfirmBtn.addEventListener('click', function () {
                modal.style.display = 'none';
                callGasAPI('updateOrderStatus', { rowIndex: String(rowIndex), status: '완료' }, function (res) {
                    if (res && res.result === 'error') {
                        handleAdminAuthFailure();
                        return;
                    }
                    lastOrderSignature = "";
                    fetchOrders();
                });
            });

            newCancelBtn.addEventListener('click', function () {
                modal.style.display = 'none';
            });
        }

        function toggleOnlineDropdown() {
            const panel = document.getElementById('onlineDropdownPanel');
            const badge = document.getElementById('onlineBadgeBtn');

            if (panel.style.display === 'none' || panel.style.display === '') {
                panel.style.display = 'block';
                badge.classList.add('active');
            } else {
                panel.style.display = 'none';
                badge.classList.remove('active');
            }
        }

        window.addEventListener('click', function(e) {
            const container = document.querySelector('.online-status-container');
            if (container && !container.contains(e.target)) {
                const panel = document.getElementById('onlineDropdownPanel');
                const badge = document.getElementById('onlineBadgeBtn');
                if (panel) panel.style.display = 'none';
                if (badge) badge.classList.remove('active');
            }
        });

        function fetchActiveUsers() {
            if (!isAdminAuthenticated || isFetchingActiveUsers) return;
            isFetchingActiveUsers = true;
            callGasAPI('getActiveUsers', {}, function(data) {
                isFetchingActiveUsers = false;
                if (!data || typeof data !== 'object') return;
                if (data.result === 'error') {
                    handleAdminAuthFailure();
                    return;
                }
                const badge = document.getElementById('activeVisitorsBadge');
                const subCount = document.getElementById('dropdownSubCount');
                const listEl = document.getElementById('onlineUserList');

                const usersArr = Array.isArray(data.users) ? data.users : [];
                const count = (typeof data.count === 'number') ? data.count : usersArr.length;
                const sig = count + '|' + JSON.stringify(usersArr);
                if (sig === lastActiveUsersSignature) return;
                lastActiveUsersSignature = sig;

                if (badge) badge.innerText = `접속 중: ${count}명`;
                if (subCount) subCount.innerText = `총 ${count}명`;

                if (listEl) {
                    listEl.innerHTML = '';
                    if (usersArr.length === 0) {
                        listEl.innerHTML = '<li style="color: #888; justify-content: center;">접속 중인 고객이 없습니다.</li>';
                    } else {
                        usersArr.forEach((userEntry) => {
                            const li = document.createElement('li');
                            if (typeof userEntry === 'object' && userEntry !== null) {
                                const name = userEntry.nickname || userEntry.name || userEntry.identifier || '회원';
                                li.textContent = `${name}`;
                            } else {
                                li.textContent = String(userEntry);
                            }
                            listEl.appendChild(li);
                        });
                    }
                }
            });
        }

        setInterval(fetchActiveUsers, 3000);
        setInterval(fetchOrders, 2500);
    </script>
