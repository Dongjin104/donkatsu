<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>장날동천 주방 대시보드</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 10px; }

        /* 상단 네비 바 */
        header { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; }
        header h1 { font-size: 1.1rem; }
        .status-badge { background: #333; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; }

        /* 주문 리스트 */
        .order-list { display: flex; flex-direction: column; gap: 8px; }
        .order-item { display: flex; align-items: center; justify-content: space-between; background: #1e1e1e; border-left: 6px solid #888; padding: 10px 12px; border-radius: 8px; }

        .order-item.unconfirmed { border-left-color: #ff5252; background: #2a1b1b; }
        .order-item.confirmed { border-left-color: #4caf50; }

        /* 주문 정보 영역 */
        .order-info { flex: 1; padding-right: 8px; }
        .time-tag { font-size: 1.1rem; font-weight: bold; color: #ffeb3b; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
        .winner-badge { background: #e91e63; color: #fff; font-size: 0.7rem; padding: 1px 6px; border-radius: 10px; font-weight: normal; }
        
        .cooking-badge { display: inline-block; background: #333; color: #ffffff; border: 1px solid #555; font-size: 0.75rem; font-weight: bold; padding: 1px 6px; border-radius: 4px; margin-right: 6px; }
        .cooking-badge.special { background: #d32f2f; border-color: #f44336; }

        .menu-text { font-size: 1.05rem; font-weight: bold; color: #ffffff; margin-bottom: 2px; }
        .sub-text { font-size: 0.8rem; color: #aaa; display: flex; align-items: center; gap: 8px; }

        /* 버튼 그룹 영역 */
        .btn-group { display: flex; gap: 6px; flex-shrink: 0; }
        
        .btn-status { width: 68px; height: 42px; font-size: 0.75rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-status.unconfirmed { background: #d32f2f; }
        .btn-status.confirmed { background: #388e3c; }

        .btn-done { width: 68px; height: 42px; font-size: 0.75rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; background: #1976d2; display: flex; align-items: center; justify-content: center; }
        .btn-done:active { background: #115293; }
    </style>
</head>
<body>

    <header>
        <h1>🍳 장날동천 주방 뷰</h1>
        <div class="status-badge">대기: <span id="unconfirmedCount" style="color:#ff5252; font-weight:bold;">0</span> / 총 <span id="totalCount">0</span></div>
    </header>

    <div id="orderContainer" class="order-list">
        <div style="text-align:center; padding: 30px; color:#888;">주문 목록을 불러오는 중...</div>
    </div>

    <script>
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbvEII7d2FfV25dHI61c5pr5Ax5AqDt5ShOPcjNsTc/exec"; 
        let previousTotalCount = 0;

        function playNewOrderSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.frequency.setValueAtTime(523.25, now);
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc1.connect(gain1); gain1.connect(ctx.destination);
                osc1.start(now); osc1.stop(now + 0.3);

                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.frequency.setValueAtTime(659.25, now + 0.15);
                gain2.gain.setValueAtTime(0.3, now + 0.15);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc2.connect(gain2); gain2.connect(ctx.destination);
                osc2.start(now + 0.15); osc2.stop(now + 0.45);
            } catch (e) {}
        }

        // 💥 CORS 에러 없는 안전한 JSONP 방식 통신 함수
        function callGasAPI(action, params = {}, callback) {
            const callbackName = 'jsonp_cb_' + Math.random().toString(36).substring(2, 9);
            window[callbackName] = function(data) {
                delete window[callbackName];
                if (script.parentNode) {
                    document.body.removeChild(script);
                }
                if (callback) callback(data);
            };

            let url = GAS_WEBAPP_URL + '?action=' + action + '&callback=' + callbackName;
            for (let key in params) {
                url += '&' + key + '=' + encodeURIComponent(params[key]);
            }

            const script = document.createElement('script');
            script.src = url;
            script.onerror = function() {
                console.error("GAS API 통신 실패");
                delete window[callbackName];
                if (script.parentNode) {
                    document.body.removeChild(script);
                }
            };
            document.body.appendChild(script);
        }

        function fetchOrders() {
            callGasAPI('getAdminOrderList', {}, function(data) {
                renderOrders(data);
            });
        }

        function renderOrders(orders) {
            const container = document.getElementById('orderContainer');
            if (!orders || orders.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 40px; color:#666;">접수된 대기 예약이 없습니다.</div>';
                document.getElementById('unconfirmedCount').innerText = 0;
                document.getElementById('totalCount').innerText = 0;
                return;
            }

            if (orders.length > previousTotalCount && previousTotalCount !== 0) {
                playNewOrderSound();
            }
            previousTotalCount = orders.length;

            let unconfirmedCnt = 0;
            let html = '';

            orders.forEach(item => {
                const isUnconfirmed = (item.status === '미확인');
                if (isUnconfirmed) unconfirmedCnt++;

                const isSpecialCooking = item.cooking && item.cooking.includes('비튀김');

                html += `
                    <div class="order-item ${isUnconfirmed ? 'unconfirmed' : 'confirmed'}">
                        <div class="order-info">
                            <div class="time-tag">
                                ⏰ ${item.pickupTime}
                                ${item.isEventWinner ? '<span class="winner-badge">🎁 이벤트 당첨</span>' : ''}
                            </div>
                            <div class="menu-text">${item.menu} ${item.extraSauce ? '(' + item.extraSauce + ')' : ''}</div>
                            <div class="sub-text">
                                <span class="cooking-badge ${isSpecialCooking ? 'special' : ''}">조리: ${item.cooking || '튀김'}</span>
                                <span>닉네임: ${item.nickname}</span>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="btn-status ${isUnconfirmed ? 'unconfirmed' : 'confirmed'}" 
                                    onclick="toggleStatus(${item.rowIndex}, '${item.status}')">
                                ${isUnconfirmed ? '미확인🔴' : '확인완료🟢'}
                            </button>
                            <button class="btn-done" onclick="completeOrder(${item.rowIndex})">
                                수령완료🏁
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('unconfirmedCount').innerText = unconfirmedCnt;
            document.getElementById('totalCount').innerText = orders.length;
        }

        function toggleStatus(rowIndex, currentStatus) {
            const nextStatus = (currentStatus === '미확인') ? '확인' : '미확인';
            callGasAPI('updateOrderStatus', { rowIndex: rowIndex, status: nextStatus }, function() {
                fetchOrders();
            });
        }

        function completeOrder(rowIndex) {
            if (!confirm("고객에게 돈가스를 전달하고 수령 완료 처리하시겠습니까?")) return;
            callGasAPI('updateOrderStatus', { rowIndex: rowIndex, status: '완료' }, function() {
                fetchOrders();
            });
        }

        setInterval(fetchOrders, 5000);
        window.onload = fetchOrders;
    </script>
</body>
</html>
