<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>돈가스 주방 주문 대시보드</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 10px; }
        
        /* 상단 현황 바 */
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 12px 15px; border-radius: 8px; margin-bottom: 12px; }
        .header h1 { font-size: 1.1rem; color: #ff9800; }
        .status-badge { background: #333; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; }
        
        /* 주문 리스트 (컴팩트 세로 압축형) */
        .order-list { display: flex; flex-direction: column; gap: 8px; }
        .order-item { display: flex; align-items: center; justify-content: space-between; background: #1e1e1e; border-left: 6px solid #888; padding: 10px 12px; border-radius: 6px; }
        
        /* 미확인 강조 (붉은 테두리 및 은은한 배경) */
        .order-item.unconfirmed { border-left-color: #ff5252; background: #2a1b1b; }
        /* 확인 완료 건 */
        .order-item.confirmed { border-left-color: #4caf50; opacity: 0.65; }

        /* 좌측: 픽업시간 & 예약정보 */
        .order-info { flex: 1; padding-right: 10px; }
        .time-tag { font-size: 1.15rem; font-weight: bold; color: #ffeb3b; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .winner-badge { background: #e91e63; color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; font-weight: normal; }
        .menu-text { font-size: 1.05rem; font-weight: bold; color: #ffffff; margin-bottom: 2px; }
        .sub-text { font-size: 0.85rem; color: #aaa; }

        /* 우측: 확인 상태 토글 대형 버튼 (터치 편의성) */
        .btn-status { width: 85px; height: 50px; font-size: 0.95rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-status.unconfirmed { background: #d32f2f; }
        .btn-status.confirmed { background: #388e3c; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🍳 장날동천 주방 뷰</h1>
        <div class="status-badge">대기: <span id="unconfirmedCount" style="color:#ff5252; font-weight:bold;">0</span>건 / 총 <span id="totalCount">0</span>건</div>
    </div>

    <div id="orderContainer" class="order-list">
        <div style="text-align:center; padding: 30px; color:#888;">주문 목록을 불러오는 중...</div>
    </div>

    <script>
        // Apps Script 웹앱 URL을 입력하세요 (또는 서버 백엔드 API)
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyKvuhElltd2F0V2SdH615cQr5Ax5qA0Dt5ShOpcjNstoCzfQydnUGrqZ9gX1DmlPRoNw/exec"; 
        let previousTotalCount = 0;

        // 🎵 신규 주문 도착 알림음 (간단한 웹 오디오 2연타 띵동 소리)
        function playNewOrderSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                
                // 첫번째 음
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.frequency.setValueAtTime(523.25, now); // C5
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc1.connect(gain1); gain1.connect(ctx.destination);
                osc1.start(now); osc1.stop(now + 0.3);

                // 두번째 음
                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.frequency.setValueAtTime(659.25, now + 0.15); // E5
                gain2.gain.setValueAtTime(0.3, now + 0.15);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc2.connect(gain2); gain2.connect(ctx.destination);
                osc2.start(now + 0.15); osc2.stop(now + 0.45);
            } catch (e) {}
        }

        // 실시간 주문 데이터 불러오기 (5초 주기 Polling)
        function fetchOrders() {
            // Google Apps Script 연동 방식 (JSONP 또는 google.script.run 방식 활용)
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(renderOrders).getAdminOrderList();
            } else {
                // 외부 웹서버(Render)에서 GAS API를 fetch로 호출할 때
                fetch(GAS_WEBAPP_URL + '?action=getAdminOrderList')
                    .then(res => res.json())
                    .then(data => renderOrders(data))
                    .catch(err => console.error("데이터 로딩 실패:", err));
            }
        }

        // 화면 그리기
        function renderOrders(orders) {
            const container = document.getElementById('orderContainer');
            if (!orders || orders.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 40px; color:#666;">접수된 예약이 없습니다.</div>';
                document.getElementById('unconfirmedCount').innerText = 0;
                document.getElementById('totalCount').innerText = 0;
                return;
            }

            // 신규 주문 발생 시 소리 재생
            if (orders.length > previousTotalCount && previousTotalCount !== 0) {
                playNewOrderSound();
            }
            previousTotalCount = orders.length;

            let unconfirmedCnt = 0;
            let html = '';

            orders.forEach(item => {
                const isUnconfirmed = (item.status === '미확인');
                if (isUnconfirmed) unconfirmedCnt++;

                html += `
                    <div class="order-item ${isUnconfirmed ? 'unconfirmed' : 'confirmed'}">
                        <div class="order-info">
                            <div class="time-tag">
                                ⏰ ${item.pickupTime}
                                ${item.isEventWinner ? '<span class="winner-badge">🎁 이벤트 당첨</span>' : ''}
                            </div>
                            <div class="menu-text">${item.menu} ${item.extraSauce ? '(' + item.extraSauce + ')' : ''}</div>
                            <div class="sub-text">조리: <b>${item.cooking}</b> | 닉네임: ${item.nickname}</div>
                        </div>
                        <button class="btn-status ${isUnconfirmed ? 'unconfirmed' : 'confirmed'}" 
                                onclick="toggleStatus(${item.rowIndex}, '${item.status}')">
                            ${isUnconfirmed ? '미확인🔴' : '확인완료🟢'}
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('unconfirmedCount').innerText = unconfirmedCnt;
            document.getElementById('totalCount').innerText = orders.length;
        }

        // 미확인/확인 버튼 클릭 시 상태 변경 및 시트 업데이트
        function toggleStatus(rowIndex, currentStatus) {
            const nextStatus = (currentStatus === '미확인') ? '확인' : '미확인';

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(fetchOrders).updateOrderStatus(rowIndex, nextStatus);
            } else {
                fetch(`${GAS_WEBAPP_URL}?action=updateOrderStatus&rowIndex=${rowIndex}&status=${encodeURIComponent(nextStatus)}`)
                    .then(res => res.json())
                    .then(() => fetchOrders());
            }
        }

        // 5초마다 자동 새로고침 (화면 갱신 없이 데이터만 바뀜)
        setInterval(fetchOrders, 5000);
        // 최초 실행
        window.onload = fetchOrders;
    </script>
</body>
</html>
