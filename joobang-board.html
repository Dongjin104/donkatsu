<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>장날동천 주방 대시보드</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 4px;
        }

        /* 상단 바 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
            padding: 5px 8px;
            border-radius: 4px;
            margin-bottom: 4px;
        }

        header h1 {
            font-size: 0.85rem;
            font-weight: bold;
        }

        .status-badge {
            background: #333;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 0.65rem;
        }

        /* 주문 리스트 카드 (초압축 간격) */
        .order-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .order-item {
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            background: #1e1e1e;
            border-left: 3px solid #888;
            border-radius: 3px;
            overflow: hidden;
        }

        .order-item.unconfirmed {
            border-left-color: #ff5252;
            background: #221515;
        }

        .order-item.confirmed {
            border-left-color: #4caf50;
            background: #1a221a;
        }

        /* 왼쪽 정보 영역 */
        .order-info {
            flex: 1;
            padding: 5px 7px;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .time-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        /* 폰트 크기를 더 미세하게 축소 */
        .time-tag {
            font-size: 0.85rem;
            font-weight: 800;
            color: #ffeb3b;
            letter-spacing: -0.5px;
        }

        .winner-badge {
            background: #e91e63;
            color: #fff;
            font-size: 0.5rem;
            padding: 1px 3px;
            border-radius: 2px;
            font-weight: bold;
        }

        .cooking-badge {
            display: inline-block;
            background: #333;
            color: #ffffff;
            border: 1px solid #555;
            font-size: 0.55rem;
            font-weight: bold;
            padding: 1px 3px;
            border-radius: 2px;
        }

        .cooking-badge.special {
            background: #d32f2f;
            border-color: #f44336;
            color: #fff;
        }

        /* 가격 폰트 축소 */
        .price-tag {
            font-size: 0.75rem;
            font-weight: bold;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.15);
            padding: 1px 4px;
            border-radius: 2px;
        }

        /* 메뉴 텍스트 압축 */
        .menu-text {
            font-size: 0.8rem;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.2;
        }

        /* 💡 이벤트 당첨 상품 상세 표시 텍스트 (메뉴와 소스 사이) */
        .event-detail-text {
            font-size: 0.72rem;
            color: #ff4081;
            font-weight: bold;
            margin-top: 1px;
        }

        /* 하단 서브 정보 (소스, 닉네임) */
        .sub-row {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 1px;
            flex-wrap: wrap;
        }

        .sauce-text {
            font-size: 0.65rem;
            color: #ff9800;
            font-weight: bold;
        }

        .nickname-text {
            font-size: 0.65rem;
            color: #aaa;
        }

        /* 오른쪽 버튼 그룹 컴팩트화 */
        .btn-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
            padding: 3px;
            background: rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .btn-status {
            width: 50px;
            height: 28px;
            font-size: 0.6rem;
            font-weight: bold;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-status.unconfirmed {
            background: #d32f2f;
        }

        .btn-status.confirmed {
            background: #388e3c;
        }

        .btn-done {
            width: 50px;
            height: 28px;
            font-size: 0.6rem;
            font-weight: bold;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            color: white;
            background: #1976d2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-done:active {
            background: #115293;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍳 장날동천 주방 뷰</h1>
        <div class="status-badge">대기: <span id="unconfirmedCount" style="color:#ff5252; font-weight:bold;">0</span> / 총
            <span id="totalCount">0</span></div>
    </header>
    <!-- 💡 커스텀 확인 모달 팝업 -->
    <div id="custom-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center;">
        <div
            style="background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 24px; width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; color: #fff;">
            <h3 id="modal-title" style="margin: 0 0 12px 0; font-size: 18px; color: #ffc107;">수령 완료 처리</h3>
            <p id="modal-desc" style="margin: 0 0 20px 0; font-size: 14px; color: #ccc; line-height: 1.5;">고객에게 돈가스를
                전달하고<br>수령 완료 처리하시겠습니까?</p>
            <div style="display: flex; gap: 10px;">
                <button id="modal-cancel-btn"
                    style="flex: 1; padding: 10px; background: #333; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">취소</button>
                <button id="modal-confirm-btn"
                    style="flex: 1; padding: 10px; background: #007bff; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">확인</button>
            </div>
        </div>
    </div>
    <div id="orderContainer" class="order-list">
        <div style="text-align:center; padding: 20px; color:#888;">주문 목록을 불러오는 중...</div>
    </div>

    <script>
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyKvuhElltd2F0V2SdH615cQr5Ax5qA0Dt5ShOpcjNstoCzfQydnUGrqZ9gX1DmlPRoNw/exec";
        let previousTotalCount = 0;
        let isInitialLoad = true; // 최초 로드 여부 체크 변수 추가

        // 🎵 AudioContext 전역 관리 및 브라우저 정책 대응
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playNewOrderSound() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;

                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.frequency.setValueAtTime(523.25, now);
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc1.connect(gain1); gain1.connect(ctx.destination);
                osc1.start(now); osc1.stop(now + 0.3);

                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.frequency.setValueAtTime(659.25, now + 0.15);
                gain2.gain.setValueAtTime(0.3, now + 0.15);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc2.connect(gain2); gain2.connect(ctx.destination);
                osc2.start(now + 0.15); osc2.stop(now + 0.45);
            } catch (e) { }
        }

        function callGasAPI(action, params = {}, callback) {
            const callbackName = 'jsonp_cb_' + Math.random().toString(36).substring(2, 9);
            window[callbackName] = function (data) {
                delete window[callbackName];
                if (script.parentNode) document.body.removeChild(script);
                if (callback) callback(data);
            };

            let url = GAS_WEBAPP_URL + '?action=' + action + '&callback=' + callbackName;
            for (let key in params) {
                url += '&' + key + '=' + encodeURIComponent(params[key]);
            }

            const script = document.createElement('script');
            script.src = url;
            script.onerror = function () {
                delete window[callbackName];
                if (script.parentNode) document.body.removeChild(script);
                if (callback) callback({ success: true });
            };
            document.body.appendChild(script);
        }

        function fetchOrders() {
            callGasAPI('getAdminOrderList', {}, function (data) {
                renderOrders(data);
            });
        }

        function renderOrders(orders) {
            const container = document.getElementById('orderContainer');
            if (!orders || orders.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 20px; color:#666;">접수된 대기 예약이 없습니다.</div>';
                document.getElementById('unconfirmedCount').innerText = 0;
                document.getElementById('totalCount').innerText = 0;
                previousTotalCount = 0;
                isInitialLoad = false;
                return;
            }

            // 첫 로드가 아닐 때, 이전 주문 수보다 현재 주문 수가 늘어났다면 새 주문 알림음 재생
            if (!isInitialLoad && orders.length > previousTotalCount) {
                playNewOrderSound();
            }

            previousTotalCount = orders.length;
            isInitialLoad = false; // 최초 로드 완료 처리

            let unconfirmedCnt = 0;
            let html = '';

            orders.forEach(item => {
                const isUnconfirmed = (item.status === '미확인');
                if (isUnconfirmed) unconfirmedCnt++;

                const isSpecialCooking = item.cooking && item.cooking.includes('비튀김');

                let priceDisplay = '';
                if (item.totalPrice !== undefined && item.totalPrice !== '') {
                    let num = Number(String(item.totalPrice).replace(/[^0-9]/g, ''));
                    priceDisplay = !isNaN(num) && num > 0 ? num.toLocaleString() + '원' : item.totalPrice;
                }

                let eventText = item.eventWinner || item.eventPrize || item.event || '';
                if (!eventText) {
                    for (let key in item) {
                        let val = String(item[key] || '');
                        if (val.includes('당첨') || val.includes('새우') || val.includes('서비스')) {
                            eventText = val;
                            break;
                        }
                    }
                }

                let eventDetailHtml = '';
                if (eventText) {
                    eventDetailHtml = `<div class="event-detail-text" style="font-size: 0.72rem; color: #ff4081; font-weight: bold; margin-top: 1px;">🎁 선물: ${eventText}</div>`;
                }

                html += `
                    <div class="order-item ${isUnconfirmed ? 'unconfirmed' : 'confirmed'}">
                        <div class="order-info">
                            <div class="top-row">
                                <div class="time-group">
                                    <span class="time-tag">⏰ ${item.pickupTime}</span>
                                    <span class="cooking-badge ${isSpecialCooking ? 'special' : ''}">조리: ${item.cooking || '튀김'}</span>
                                    ${item.isEventWinner || eventText ? '<span class="winner-badge">🎁 이벤트 당첨</span>' : ''}
                                </div>
                                ${priceDisplay ? '<div class="price-tag">💰 ' + priceDisplay + '</div>' : ''}
                            </div>
                            <div class="menu-text">${item.menu}</div>
                            ${eventDetailHtml}
                            <div class="sub-row">
                                ${item.extraSauce && item.extraSauce !== '없음' ? '<span class="sauce-text">소스: ' + item.extraSauce + '</span>' : ''}
                                <span class="nickname-text">👤 ${item.nickname}</span>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="btn-status ${isUnconfirmed ? 'unconfirmed' : 'confirmed'}" 
                                    onclick="toggleStatus(${item.rowIndex}, '${item.status}')">
                                ${isUnconfirmed ? '미확인🔴' : '확인완료🟢'}
                            </button>
                            <button class="btn-done" onclick="completeOrder(${item.rowIndex})">
                                수령완료🏁
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('unconfirmedCount').innerText = unconfirmedCnt;
            document.getElementById('totalCount').innerText = orders.length;
        }

        function toggleStatus(rowIndex, currentStatus) {
            // 주방 뷰 화면을 터치/클릭하는 순간 AudioContext도 자동으로 활성화됩니다.
            getAudioContext(); 
            const nextStatus = (currentStatus === '미확인') ? '확인' : '미확인';
            callGasAPI('updateOrderStatus', { rowIndex: String(rowIndex), status: nextStatus }, function (res) {
                fetchOrders();
            });
        }

        function completeOrder(rowIndex) {
            getAudioContext();
            const modal = document.getElementById('custom-modal');
            const confirmBtn = document.getElementById('modal-confirm-btn');
            const cancelBtn = document.getElementById('modal-cancel-btn');

            modal.style.display = 'flex';

            const newConfirmBtn = confirmBtn.cloneNode(true);
            const newCancelBtn = cancelBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            newConfirmBtn.addEventListener('click', function () {
                modal.style.display = 'none';
                callGasAPI('updateOrderStatus', { rowIndex: String(rowIndex), status: '완료' }, function (res) { });
                fetchOrders();
            });

            newCancelBtn.addEventListener('click', function () {
                modal.style.display = 'none';
            });
        }

        // 페이지 어디든 최초 터치/클릭하는 순간 오디오 권한이 풀리도록 설정
        document.addEventListener('click', function() {
            getAudioContext();
        }, { once: true });

        setInterval(fetchOrders, 5000);
        window.onload = fetchOrders;
    </script>
</body>

</html>
