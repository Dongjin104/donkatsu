<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장날동천 메뉴 사진 일괄 등록기</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 540px;
            margin: 0 auto;
            background: #ffffff;
            padding: 28px 22px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #e65100;
            font-size: 22px;
            margin: 0 0 6px 0;
            text-align: center;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 15px;
        }

        select,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            background-color: #fafafa;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .preview-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
            aspect-ratio: 1;
            background: #eee;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-badge {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .submit-btn {
            width: 100%;
            background-color: #e65100;
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(230, 81, 0, 0.25);
        }

        .submit-btn:disabled {
            background-color: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        .retry-btn {
            width: 100%;
            background-color: #1D4ED8;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            display: none;
        }

        .status-box {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            background: #fff3e0;
            border: 1px solid #ffe0b2;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: #2e7d32;
            width: 0%;
            transition: width 0.3s;
        }

        .info-note {
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #0d47a1;
            margin-bottom: 20px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📸 메뉴 사진 일괄 등록기</h1>
        <div class="subtitle">핸드폰 사진을 선택하면 구글 드라이브에 자동 업로드 및 시트 연동됩니다</div>

        <div class="info-note">
            💡 <b>사용 방법:</b><br>
            1. 사진을 연결할 <b>메뉴</b>를 선택하세요.<br>
            2. 사진을 <b>여러 장 한꺼번에</b> 선택하세요. (자동 용량 압축)<br>
            3. <b>[사진 일괄 업로드]</b> 버튼을 누르면 시트 D열에 자동 입력됩니다!
        </div>

        <div class="form-group">
            <label for="menuSelect">1. 사진을 등록할 메뉴 선택 *</label>
            <select id="menuSelect" disabled>
                <option value="">메뉴 목록 불러오는 중...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="fileInput">2. 사진 선택 (다중 선택 가능) *</label>
            <input type="file" id="fileInput" accept="image/*" multiple>
            <div id="previewGrid" class="preview-grid"></div>
        </div>

        <button type="button" id="uploadBtn" class="submit-btn" onclick="uploadImages(false)" disabled>🚀 사진 일괄 업로드 및 시트
            등록</button>
        <button type="button" id="retryFailedBtn" class="retry-btn" onclick="uploadImages(true)">🔁 실패한 사진만 다시 업로드</button>

        <div id="statusBox" class="status-box">
            <div id="statusText" style="font-weight: bold; color: #e65100;">준비 중...</div>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyKvuhElltd2F0V2SdH615cQr5Ax5qA0Dt5ShOpcjNstoCzfQydnUGrqZ9gX1DmlPRoNw/exec";
        let selectedFiles = [];
        let failedFilesList = [];
        let isUploading = false;
        let previewObjectUrls = [];

        function escapeHtml(str) {
            return String(str === null || str === undefined ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function clearPreviewObjectUrls() {
            if (previewObjectUrls.length > 0) {
                previewObjectUrls.forEach(url => {
                    try { URL.revokeObjectURL(url); } catch (e) {}
                });
                previewObjectUrls = [];
            }
        }

        window.addEventListener('DOMContentLoaded', async function () {
            try {
                const res = await fetch(WEB_APP_URL + "?action=getSettings", { method: 'GET' });
                const text = await res.text();
                const data = JSON.parse(text);

                const select = document.getElementById('menuSelect');
                select.innerHTML = '<option value="" disabled selected>-- 메뉴를 선택하세요 --</option>';

                if (data.menuList && data.menuList.length > 0) {
                    data.menuList.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.name;
                        opt.textContent = m.name;
                        select.appendChild(opt);
                    });
                    select.disabled = false;
                } else {
                    select.innerHTML = '<option value="">등록된 메뉴가 없습니다</option>';
                }
            } catch (e) {
                alert("메뉴 목록을 불러오지 못했습니다. 새로고침해 주세요.");
            }
        });

        document.getElementById('fileInput').addEventListener('change', function (e) {
            if (isUploading) return;
            selectedFiles = Array.from(e.target.files || []);
            failedFilesList = [];
            document.getElementById('retryFailedBtn').style.display = 'none';
            const previewGrid = document.getElementById('previewGrid');
            previewGrid.innerHTML = '';
            clearPreviewObjectUrls();

            if (selectedFiles.length > 0) {
                selectedFiles.forEach((file, idx) => {
                    const div = document.createElement('div');
                    div.className = 'preview-item';

                    const img = document.createElement('img');
                    if (window.URL && typeof window.URL.createObjectURL === 'function') {
                        const objUrl = URL.createObjectURL(file);
                        previewObjectUrls.push(objUrl);
                        img.src = objUrl;
                    } else {
                        const reader = new FileReader();
                        reader.onload = function (ev) {
                            img.src = ev.target.result;
                        };
                        reader.readAsDataURL(file);
                    }

                    const badge = document.createElement('span');
                    badge.className = 'preview-badge';
                    badge.textContent = `${idx + 1}번`;

                    div.appendChild(img);
                    div.appendChild(badge);
                    previewGrid.appendChild(div);
                });
                checkFormReady();
            } else {
                document.getElementById('uploadBtn').disabled = true;
            }
        });

        document.getElementById('menuSelect').addEventListener('change', checkFormReady);

        function checkFormReady() {
            const menuVal = document.getElementById('menuSelect').value;
            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.disabled = Boolean(isUploading || !(menuVal && selectedFiles.length > 0));
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const useObjectUrl = Boolean(window.URL && typeof window.URL.createObjectURL === 'function');
                const sourceUrl = useObjectUrl ? URL.createObjectURL(file) : null;

                const cleanupSourceUrl = () => {
                    if (sourceUrl) {
                        try { URL.revokeObjectURL(sourceUrl); } catch (e) {}
                    }
                };

                const img = new Image();
                img.onload = function () {
                    cleanupSourceUrl();
                    const MAX_LONG_EDGE = 800;
                    let width = img.width || 0;
                    let height = img.height || 0;

                    if (width <= 0 || height <= 0) {
                        reject(new Error("이미지 크기를 읽을 수 없습니다."));
                        return;
                    }

                    if (width >= height && width > MAX_LONG_EDGE) {
                        height = Math.round(height * (MAX_LONG_EDGE / width));
                        width = MAX_LONG_EDGE;
                    } else if (height > width && height > MAX_LONG_EDGE) {
                        width = Math.round(width * (MAX_LONG_EDGE / height));
                        height = MAX_LONG_EDGE;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
                    resolve(dataUrl);
                };
                img.onerror = () => {
                    cleanupSourceUrl();
                    reject(new Error("이미지 디코딩에 실패했습니다."));
                };

                if (sourceUrl) {
                    img.src = sourceUrl;
                } else {
                    const reader = new FileReader();
                    reader.onload = function (event) {
                        img.src = event.target.result;
                    };
                    reader.onerror = () => reject(new Error("파일 읽기에 실패했습니다."));
                    reader.readAsDataURL(file);
                }
            });
        }

        async function uploadImages(retryOnly = false) {
            if (isUploading) return;
            const menuName = document.getElementById('menuSelect').value;
            const targetFiles = retryOnly ? failedFilesList.slice() : selectedFiles.slice();
            if (!menuName || targetFiles.length === 0) return;

            isUploading = true;

            const uploadBtn = document.getElementById('uploadBtn');
            const retryBtn = document.getElementById('retryFailedBtn');
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const progressFill = document.getElementById('progressFill');

            uploadBtn.disabled = true;
            retryBtn.style.display = 'none';
            retryBtn.disabled = true;
            document.getElementById('menuSelect').disabled = true;
            document.getElementById('fileInput').disabled = true;

            statusBox.style.display = 'block';
            statusBox.style.background = '#fff3e0';
            statusBox.style.borderColor = '#ffe0b2';
            progressFill.style.width = '0%';

            const currentFailed = [];
            let successCount = 0;

            try {
                for (let i = 0; i < targetFiles.length; i++) {
                    const file = targetFiles[i];
                    const isFirstUpload = (!retryOnly && i === 0);

                    statusText.style.color = '#e65100';
                    statusText.innerHTML = `⏳ [${i + 1} / ${targetFiles.length}] 번째 사진 압축 및 업로드 중...<br><span style="font-size:12px; color:#666;">(${escapeHtml(file.name)})</span>`;

                    try {
                        const base64Data = await compressImage(file);

                        const payload = {
                            action: 'uploadMenuImage',
                            menuName: menuName,
                            imageBase64: base64Data,
                            fileName: `${menuName}_${Date.now()}_${i + 1}.jpg`,
                            isFirst: isFirstUpload
                        };

                        const res = await fetch(WEB_APP_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify(payload)
                        });

                        const text = await res.text();
                        let result = null;
                        try { result = JSON.parse(text); } catch (e) { }

                        if (!res.ok || !result || result.result !== 'success') {
                            throw new Error((result && result.message) ? result.message : '서버 응답 오류');
                        }

                        successCount++;
                    } catch (err) {
                        currentFailed.push(file);
                    }

                    const percent = Math.round(((i + 1) / targetFiles.length) * 100);
                    progressFill.style.width = percent + '%';
                }

                failedFilesList = currentFailed;

                if (currentFailed.length === 0) {
                    statusBox.style.background = '#e8f5e9';
                    statusBox.style.borderColor = '#c8e6c9';
                    statusText.style.color = '#2e7d32';
                    statusText.innerHTML = `🎉 <b>총 ${successCount}장의 사진 등록 완료!</b><br><span style="font-size:13px; color:#444;">구글 드라이브 저장 및 [${escapeHtml(menuName)}] 시트 반영이 모두 끝났습니다.</span>`;

                    document.getElementById('fileInput').value = '';
                    document.getElementById('previewGrid').innerHTML = '';
                    clearPreviewObjectUrls();
                    selectedFiles = [];
                } else {
                    statusBox.style.background = '#ffebee';
                    statusBox.style.borderColor = '#ffcdd2';
                    statusText.style.color = '#c62828';
                    const failedNamesHtml = currentFailed.map(f => escapeHtml(f.name)).join(', ');
                    statusText.innerHTML = `⚠️ <b>일부 업로드 실패</b> (성공 ${successCount}장 / 실패 ${currentFailed.length}장)<br><span style="font-size:12.5px; color:#555;">실패 파일: ${failedNamesHtml}</span>`;
                    retryBtn.disabled = false;
                    retryBtn.style.display = 'block';
                }
            } finally {
                isUploading = false;
                document.getElementById('menuSelect').disabled = false;
                document.getElementById('fileInput').disabled = false;
                checkFormReady();
            }
        }
    </script>
</body>

</html>
